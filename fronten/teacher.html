<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ AI - Teachers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6fb;
    color:#111827;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:240px;
    height:100vh;
    background:#111827;
    color:white;
    padding:25px 15px;
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:35px;
}

.logo span{
    color:#f97316;
}

.menu{
    padding:14px 15px;
    margin-bottom:8px;
    border-radius:10px;
    color:#d1d5db;
    cursor:pointer;
}

.menu:hover,
.menu.active{
    background:#f97316;
    color:white;
}

.main{
    margin-left:240px;
    padding:30px;
}

.header{
    margin-bottom:25px;
}

.header h1{
    color:#172554;
}

.header p{
    color:#64748b;
    margin-top:6px;
}

.toolbar{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.search{
    flex:1;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

button{
    border:none;
    border-radius:8px;
    padding:11px 17px;
    cursor:pointer;
    font-weight:bold;
}

.add{
    background:#f97316;
    color:white;
}

.edit{
    background:#2563eb;
    color:white;
}

.delete{
    background:#dc2626;
    color:white;
}

.table-card{
    background:white;
    border-radius:14px;
    overflow-x:auto;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#172554;
    color:white;
    padding:15px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}

.role{
    background:#ede9fe;
    color:#6d28d9;
    padding:6px 12px;
    border-radius:20px;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:450px;
    max-width:90%;
    padding:25px;
    border-radius:15px;
}

.modal-box h2{
    color:#172554;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

.actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.cancel{
    background:#e5e7eb;
}

#message{
    position:fixed;
    right:25px;
    top:25px;
    padding:15px 20px;
    border-radius:8px;
    color:white;
    display:none;
    font-weight:bold;
}

.success{
    background:#16a34a;
}

.error{
    background:#dc2626;
}
</style>
</head>

<body>

<div class="sidebar">

    <div class="logo">
        XYZ <span>AI</span>
    </div>

    <div class="menu"
         onclick="go('principal.html')">
        📊 Dashboard
    </div>

    <div class="menu"
         onclick="go('student.html')">
        👨‍🎓 Students
    </div>

    <div class="menu active">
        👩‍🏫 Teachers
    </div>

    <div class="menu"
         onclick="go('attendance.html')">
        📅 Attendance
    </div>

    <div class="menu"
         onclick="go('reports.html')">
        📑 Reports
    </div>

</div>


<div class="main">

    <div class="header">
        <h1>Teacher Management</h1>
        <p>Manage teacher records</p>
    </div>


    <div class="toolbar">

        <input
            class="search"
            id="search"
            placeholder="Search teacher..."
            onkeyup="searchTeachers()"
        >

        <button
            class="add"
            onclick="openModal()">
            + Add Teacher
        </button>

    </div>


    <div class="table-card">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="teacherTable"></tbody>

        </table>

    </div>

</div>


<div class="modal" id="modal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Add Teacher
        </h2>

        <form id="teacherForm">

            <input
                type="hidden"
                id="teacherId"
            >

            <div class="form-group">

                <label>Name</label>

                <input
                    id="name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Username</label>

                <input
                    id="username"
                    required
                >

            </div>


            <div class="actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="closeModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="add">
                    Save
                </button>

            </div>

        </form>

    </div>

</div>


<div id="message"></div>


<script>

const API =
    "http://127.0.0.1:8000";

let teachers = [];


function go(page){
    window.location.href = page;
}


function showMessage(text,type="success"){

    const box =
        document.getElementById("message");

    box.textContent = text;
    box.className = type;
    box.style.display = "block";

    setTimeout(()=>{
        box.style.display = "none";
    },2500);
}


async function loadTeachers(){

    try{

        const response =
            await fetch(API + "/teachers");

        if(!response.ok){
            throw new Error(
                "Failed to load teachers"
            );
        }

        teachers =
            await response.json();

        renderTeachers(teachers);

    }catch(error){

        showMessage(
            error.message,
            "error"
        );
    }
}


function renderTeachers(list){

    const table =
        document.getElementById(
            "teacherTable"
        );

    table.innerHTML = "";

    if(list.length === 0){

        table.innerHTML = `
            <tr>
                <td colspan="5"
                    style="text-align:center;padding:30px">
                    No teachers found
                </td>
            </tr>
        `;

        return;
    }


    list.forEach(teacher=>{

        table.innerHTML += `

            <tr>

                <td>${teacher.id}</td>

                <td>
                    <strong>
                        ${teacher.name}
                    </strong>
                </td>

                <td>
                    ${teacher.username}
                </td>

                <td>
                    <span class="role">
                        ${teacher.role}
                    </span>
                </td>

                <td>

                    <button
                        class="edit"
                        onclick="editTeacher(${teacher.id})">
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteTeacher(${teacher.id})">
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });
}


function searchTeachers(){

    const value =
        document.getElementById(
            "search"
        ).value.toLowerCase();

    const filtered =
        teachers.filter(teacher =>
            teacher.name
                .toLowerCase()
                .includes(value) ||
            teacher.username
                .toLowerCase()
                .includes(value)
        );

    renderTeachers(filtered);
}


function openModal(teacher=null){

    document
        .getElementById("modal")
        .classList.add("show");


    if(teacher){

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Edit Teacher";

        document.getElementById(
            "teacherId"
        ).value =
            teacher.id;

        document.getElementById(
            "name"
        ).value =
            teacher.name;

        document.getElementById(
            "username"
        ).value =
            teacher.username;

    }else{

        document.getElementById(
            "modalTitle"
        ).textContent =
            "Add Teacher";

        document.getElementById(
            "teacherForm"
        ).reset();

        document.getElementById(
            "teacherId"
        ).value = "";
    }
}


function closeModal(){

    document
        .getElementById("modal")
        .classList.remove("show");
}


function editTeacher(id){

    const teacher =
        teachers.find(
            t => t.id === id
        );

    if(teacher){
        openModal(teacher);
    }
}


document.getElementById(
    "teacherForm"
).addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const id =
            document.getElementById(
                "teacherId"
            ).value;


        const data = {

            name:
                document.getElementById(
                    "name"
                ).value,

            username:
                document.getElementById(
                    "username"
                ).value

        };


        try{

            let response;


            if(id){

                response =
                    await fetch(
                        API +
                        `/teachers/${id}`,
                        {
                            method:"PUT",
                            headers:{
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify(data)
                        }
                    );

            }else{

                response =
                    await fetch(
                        API + "/teachers",
                        {
                            method:"POST",
                            headers:{
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify(data)
                        }
                    );
            }


            const result =
                await response.json();


            if(!response.ok){

                throw new Error(
                    result.detail ||
                    "Operation failed"
                );
            }


            showMessage(
                id
                ? "Teacher updated successfully"
                : "Teacher added successfully"
            );


            closeModal();

            loadTeachers();


        }catch(error){

            showMessage(
                error.message,
                "error"
            );
        }

    }
);


async function deleteTeacher(id){

    if(
        !confirm(
            "Delete this teacher?"
        )
    ){
        return;
    }


    try{

        const response =
            await fetch(
                API +
                `/teachers/${id}`,
                {
                    method:"DELETE"
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            throw new Error(
                result.detail ||
                "Delete failed"
            );
        }


        showMessage(
            "Teacher deleted successfully"
        );

        loadTeachers();


    }catch(error){

        showMessage(
            error.message,
            "error"
        );
    }
}


loadTeachers();

</script>

</body>
</html>
