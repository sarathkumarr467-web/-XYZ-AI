<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>XYZ AI Assistant</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.container {
    width: 750px;
    max-width: 95%;
    margin: 40px auto;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

.header {
    padding: 22px;
    background: #1e3a8a;
    color: white;
    text-align: center;
}

.header h1 {
    margin: 0;
}

.header p {
    margin-bottom: 0;
}

#chat {
    height: 450px;
    overflow-y: auto;
    padding: 20px;
}

.message {
    display: flex;
    margin: 12px 0;
}

.user {
    justify-content: flex-end;
}

.ai {
    justify-content: flex-start;
}

.bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
}

.user .bubble {
    background: #dbeafe;
}

.ai .bubble {
    background: #f1f5f9;
}

.input-area {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-top: 1px solid #ddd;
}

#message {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 9px;
    background: #1e3a8a;
    color: white;
    cursor: pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>🤖 XYZ AI Assistant</h1>

<p>School Management AI Assistant</p>

</div>

<div id="chat">

<div class="message ai">

<div class="bubble">

Hello! 👋 Ask me about students,
attendance, teachers or the dashboard.

</div>

</div>

</div>

<div class="input-area">

<input
    id="message"
    type="text"
    placeholder="Ask something..."
>

<button onclick="sendMessage()">
Send
</button>

</div>

</div>


<script>

const API_URL =
    "http://127.0.0.1:8000";


function addMessage(
    type,
    text
) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


async function sendMessage() {

    const input =
        document.getElementById("message");

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        "user",
        message
    );

    input.value = "";

    try {

        const response =
            await fetch(
                `${API_URL}/ai/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: message
                        })
                }
            );

        const data =
            await response.json();

        if (
            data.success &&
            data.assistant
        ) {

            addMessage(
                "ai",
                data.assistant.response
            );

        } else {

            addMessage(
                "ai",
                data.message ||
                "Unable to process request."
            );
        }

    } catch (error) {

        addMessage(
            "ai",
            "Unable to connect to backend."
        );

        console.error(error);
    }
}


document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {
                sendMessage();
            }

        }
    );

</script>

</body>

</html>
